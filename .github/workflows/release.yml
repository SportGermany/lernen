# Baut eine signierte APK und veröffentlicht sie als GitHub Release.
# Start: entweder Tag vX.Y.Z pushen oder unter Actions → Release → „Run workflow“ (nimmt versionName aus app/build.gradle.kts).
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORT, KEY_ALIAS, KEY_PASSWORT
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Secrets vorhanden?
        env:
          K: ${{ secrets.KEYSTORE_BASE64 }}
          P: ${{ secrets.KEYSTORE_PASSWORT }}
          A: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORT }}
        run: |
          for n in K P A KP; do
            if [ -z "${!n}" ]; then echo "::error::Secret fehlt. Bitte KEYSTORE_BASE64, KEYSTORE_PASSWORT, KEY_ALIAS, KEY_PASSWORT anlegen."; exit 1; fi
          done
      - name: Version bestimmen
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG#v}" != "$NAME" ]; then echo "::error::Tag $TAG passt nicht zu versionName $NAME"; exit 1; fi
          else
            TAG="v$NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$NAME" >> "$GITHUB_ENV"
      - name: Tests
        run: ./gradlew test --no-daemon
      - name: Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lernen.jks"
      - name: APK bauen
        env:
          LERNEN_KEYSTORE: ${{ runner.temp }}/lernen.jks
          LERNEN_KEYSTORE_PASSWORT: ${{ secrets.KEYSTORE_PASSWORT }}
          LERNEN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LERNEN_KEY_PASSWORT: ${{ secrets.KEY_PASSWORT }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "lernen-${VERSION}.apk"
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "lernen-${VERSION}.apk" --target "$GITHUB_SHA" --title "Lernen ${VERSION}" --generate-notes
